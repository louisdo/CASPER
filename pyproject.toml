[project]
name = "cspr"
version = "0.1.0"
description = "Citation Sparse/Dense Retrieval experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "tqdm",
    "pytrec-eval",
]

[dependency-groups]
dense = [
    "torch==2.5.1",
    "numpy<2",
    "faiss-gpu",
    "transformers==4.51.3",
    "sentence-transformers",
]
cspr = [
    { include-group = "dense" },
]
colbert = [
    "colbert-ai>=0.2.0",
]
dev = [
    "ruff",
]

[tool.uv]
conflicts = [
    [{ group = "colbert" }, { group = "dense" }]
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]
