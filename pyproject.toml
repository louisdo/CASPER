[project]
name = "cspr"
version = "0.1.0"
description = "Citation Sparse/Dense Retrieval experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.3",
    "tqdm",
    "pytrec-eval",
    "openai",
    "python-dotenv",
    "rapidfuzz",
    "pyserini",
    # onnxruntime (pulled in by pyserini) dropped cp310 wheels at 1.20; the venv is
    # Python 3.10, so cap it to a version that still has 3.10 wheels.
    "onnxruntime<1.20",
]

[dependency-groups]
dense = [
    "torch==2.5.1",
    "numpy<2",
    "faiss-gpu",
    "transformers==4.51.3",
    "sentence-transformers",
    "datasets",
    "accelerate",
    "flashtext",
]
cspr = [
    { include-group = "dense" },
]
colbert = [
    "colbert-ai>=0.2.0",
]
dev = [
    "ruff",
]

[tool.uv]
conflicts = [
    [{ group = "colbert" }, { group = "dense" }]
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]
