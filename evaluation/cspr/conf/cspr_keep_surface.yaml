# Eval/index config for the inplace + keep_surface model. tokenizer.mode and
# keep_surface MUST match the finetuned checkpoint (cspr_keep_surface.yaml) and
# how it was continuously pretrained.

# pretrained checkpoint to use -- set to the finetuned keep_surface model dir
# (the dated subfolder produced by train.py), e.g.
#   /scratch/lamdo/CSpR/finetuning/distilbert+15k+inplace+keepsurface+cspr/<date>/
model_dir: /scratch/lamdo/CSpR/finetuning/distilbert+15k+inplace+keepsurface+cspr/
# vocab size before keyphrase tokens were added
original_vocab_size: 30522

# config for tokenizer
tokenizer:
  use_default: false
  keyphrase_vocab_path: /scratch/lamdo/CSpR/keyphrase_vocab/keyphrase_grouping/keyphrase_vocab.json
  # append: keyphrases/[MASK] after [SEP] (text_pair). inplace: keyphrase tokens
  # rewritten where they occur in the text. Must match how the model was pretrained.
  mode: inplace # append
  num_keyphrase_slots: 5   # append mode only
  mask_only: false         # append mode only
  keep_surface: true       # inplace mode only: keep surface words alongside the token

# pooling per vocab partition; keys must match the partition names
pooling_method:
  token: max
  phrase: sum #max

# which part of the sequence each partition pools over, split at the first [SEP]:
#   before -> text side, after -> keyphrase/[MASK] segment, full -> whole sequence.
pooling_segments:
  token: full # before
  phrase: full # after

bf16: true

trust_remote_code: True
